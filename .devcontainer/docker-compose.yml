services:
  app:
    build: .
    ports:
      - "4200:4200"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: package.json
